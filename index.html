<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>校内ルート案内 3Dモデル</title>
<style>
:root{--bg:#eef2f6;--fg:#1d2733;--pn:#fffd;--bd:#b9c4d0;--ac:#2b7fd4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c24;--fg:#e6edf5;--pn:#222c38e8;--bd:#3b4958;--ac:#5aa6f0}}
:root[data-theme="dark"]{--bg:#161c24;--fg:#e6edf5;--pn:#222c38e8;--bd:#3b4958;--ac:#5aa6f0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;left:8px;top:calc(8px + env(safe-area-inset-top,0px));background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:13px;max-width:210px}
#ui h1{font-size:14px;margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
button{font:inherit;background:transparent;color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:block;margin:4px 0}
input[type=range]{width:100%}
#lg{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px));max-width:120px;line-height:1.5;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:12px}
#lg i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border:1px solid #0004}
#rt{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:430px;max-height:40vh;overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:13px}
select{font:inherit;max-width:42%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:3px}
#stp{margin:4px 0 0 18px;padding:0}#sum{font-weight:600;margin:4px 0}
#ut{display:none;float:right;margin-left:10px}
#stt{display:none;white-space:nowrap}
@media (max-width:640px){
 body{display:flex;flex-direction:column}
 #cv{flex:1;min-height:0;height:auto}
 #rt{position:static;max-width:none;max-height:44vh;max-height:44dvh;border-radius:14px 14px 0 0;border-width:1px 0 0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));font-size:14px}
 #ut{display:inline-block}
 #uib,#lg{display:none}
 body.open #uib,body.open #lg{display:block}
 #lg{top:calc(60px + env(safe-area-inset-top,0px))}
 button,select{min-height:38px}
 select{max-width:40%}
 #stp li{padding:3px 0}
 #stp{display:none}
 #rt.open #stp{display:block}
 #stt{display:inline-block}
 #sum{margin:2px 0}
}
</style></head><body>

function stairs(g,a,col,d){const [x,y,w,h]=a;d=d||(h>=w?'S':'E');

// 地下道入口: 地上から下りる階段(dir=1:+z方向へ下る / -1:-z方向へ下る)

function label(g,text,x,y,w,h,y0){
 const c=document.createElement('canvas');c.width=256;c.height=64;const t=c.getContext('2d');
 let fs=38;t.font='bold '+fs+'px sans-serif';while(t.measureText(text).width>244&&fs>12){fs--;t.font='bold '+fs+'px sans-serif'}

 t.strokeText(text,128,34);t.fillText(text,128,34);

const ceils=[],doorsM=[];

D.floors.forEach((fl,i)=>{

  if(w.diag){const [A,B,wd]=w.diag,dx=B[0]-A[0],dz=B[1]-A[1],m=new THREE.Mesh(new THREE.BoxGeometry((Math.hypot(dx,dz)+20)*S,.25,wd*S),new THREE.MeshLambertMaterial({color:COL.b}));

  box(g,...r,0,gr?(w.h||(i?.2:.35)):.25,gr?COL.g:w.type==='walkway'?COL.b:COL.c,1);

  st.floors[fl.level+1]?stairs(sg,a,col,st.landing):box(g,...a,0,.25,col,1)});

// ---- ルート検索 ----
const NODE={},ADJ={},cx=r=>[r[0]+r[2]/2,r[1]+r[3]/2],dd=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1])*S,RC=0xff3b30;
D.floors.forEach(f=>{f.rooms.forEach(r=>NODE[r.id]={k:'room',name:r.name,rect:r.rect,L:f.level});f.walk.forEach(w=>NODE[w.id]={k:w.type,name:w.name||'',rect:w.rect,L:f.level,roof:w.roof,blocked:w.blocked,diag:w.diag})});
D.stairs.forEach(st=>Object.entries(st.floors).forEach(([l,r])=>NODE[st.id+'@'+l]={k:'stair-'+st.type,name:st.label,rect:r,L:+l,quiet:st.quiet}));
D.underpass.entrances.forEach(e=>NODE['UP-1:'+e.dir]={k:'underpass',name:D.underpass.label,rect:e.rect,L:1,quiet:D.underpass.quiet});
const addE=(a,b,c,via,t)=>{(ADJ[a]=ADJ[a]||[]).push({to:b,c,via,t});(ADJ[b]=ADJ[b]||[]).push({to:a,c,via,t})};
D.links.forEach(([a,b,t])=>{const A=NODE[a],B=NODE[b];if(!A||!B||t==='door')return;
 if(t==='stairs')return addE(a,b,9,null,t);
 if(t==='underpass'&&A.k===B.k)return addE(a,b,dd(cx(A.rect),cx(B.rect)),null,t);
 const x0=Math.max(A.rect[0],B.rect[0]),x1=Math.min(A.rect[0]+A.rect[2],B.rect[0]+B.rect[2]),y0=Math.max(A.rect[1],B.rect[1]),y1=Math.min(A.rect[1]+A.rect[3],B.rect[1]+B.rect[3]),v=[(x0+x1)/2,(y0+y1)/2];
 addE(a,b,dd(cx(A.rect),v)+dd(v,cx(B.rect)),v,t)});
(D.doors||[]).forEach(d=>{const bt=(d.between||[]).filter(k=>NODE[k]),v=cx(d.rect);
 for(let i=0;i<bt.length;i++)for(let j=i+1;j<bt.length;j++)addE(bt[i],bt[j],dd(cx(NODE[bt[i]].rect),v)+dd(v,cx(NODE[bt[j]].rect)),v,'door')});
const isOut=k=>['walkway','ground','stair-outdoor','underpass'].includes(NODE[k].k)&&!NODE[k].roof;
function dij(s,g,o){const dist={[s]:0},prev={},done={};
 for(;;){let u=null;for(const k in dist)if(!done[k]&&(u===null||dist[k]<dist[u]))u=k;if(u===null)return null;if(u===g)break;done[u]=1;if((NODE[u].k==='room'||NODE[u].blocked)&&u!==s)continue; // 教室は通り抜け不可
  for(const e of ADJ[u]||[]){let c=e.c;if(isOut(u)||isOut(e.to))c*=o.out;
   if(o.quiet){if(e.t==='stairs'||e.t==='underpass'){if(NODE[u].quiet||NODE[e.to].quiet)c*=.3;else if(e.t==='stairs')c+=200}}
   const nd=dist[u]+c;if(dist[e.to]===undefined||nd<dist[e.to]){dist[e.to]=nd;prev[e.to]={u,e}}}}

const VAR=[['最短',{out:1}],['屋外を避ける',{out:6}],['空いている',{out:1,quiet:1}]];
function findRoutes(a,b,v){const out=[];VAR.forEach(([n,op])=>{let r=dij(a,b,op);
 if(v&&v!==a&&v!==b){const r1=dij(a,v,op),r2=dij(v,b,op);r=r1&&r2?{nodes:r1.nodes.concat(r2.nodes.slice(1)),edges:r1.edges.concat(r2.edges),len:r1.len+r2.len,via:v}:null}
 if(!r)return;r.name=n;const key=r.nodes.join();const p=out.find(x=>x.key===key);if(p)p.name+='・'+n;else{r.key=key;out.push(r)}});return out}
let ro=[];const W=(p,y)=>new THREE.Vector3((p[0]-OX)*S,y,(p[1]-OZ)*S),BC=0x1a73e8;
function tube(par,pts,k,on){if(pts.length<2)return;const cp=new THREE.CurvePath();for(let i=0;i<pts.length-1;i++)cp.add(new THREE.LineCurve3(pts[i],pts[i+1]));

function dot(par,p,col){[[1.5,0xffffff,12],[1,col,13]].forEach(([rd,c,od])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(rd,14,14),new THREE.MeshBasicMaterial({color:c,depthTest:false}));m.position.copy(W(p,1.4));m.renderOrder=od;par.add(m);ro.push(m)})}
// 折り返し階段の経路: 下階の乗り口→踊り場→上階の降り口(階段の端)
function flight(sid,lo,up){const st=D.stairs.find(x=>x.id===sid),a=st.floors[lo],d=st.landing,vz=d==='N'||d==='S',rev=d==='N'||d==='W',L=vz?a[3]:a[2],Sw=vz?a[2]:a[3],ld=L*.2,fl=L-ld,m=Math.min(3,L*.05);
 const P=(l,s)=>{const q=rev?L-l:l;return vz?[a[0]+s,a[1]+q]:[a[0]+q,a[1]+s]},H=FH/2+.8;
 const pts=[[P(m,Sw/4),.8],[P(fl,Sw/4),H],[P(fl+ld/2,Sw/4),H],[P(fl+ld/2,Sw*3/4),H],[P(fl,Sw*3/4),H],[P(m,Sw*3/4),FH+.8]];

// 廊下・通路は長辺方向の中心線を通る
const inside=(n,P,Q)=>{if(n.k==='room'||n.k.startsWith('stair'))return [P,Q];
 if(n.diag){const [A,B]=n.diag,dx=B[0]-A[0],dz=B[1]-A[1],l2=dx*dx+dz*dz,pj=p=>{const t=Math.max(0,Math.min(1,((p[0]-A[0])*dx+(p[1]-A[1])*dz)/l2));return [A[0]+t*dx,A[1]+t*dz]};return [P,pj(P),pj(Q),Q]}const [x,y,w,h]=n.rect,c=cx(n.rect);if(Math.max(w,h)/Math.min(w,h)<1.5)return [P,Q];

function drawRoute(r,k,on){const nd=r.nodes.map(x=>NODE[x]),E=r.edges,all=[];

   push(inside(n,ent,g.S));fl();tube(sgs[lo-1],(up?g.pts:g.pts.slice().reverse()).map(([p,y])=>W(p,y)),k,on);L=b.L;ent=g.E;continue}

function fit(o){const xs=o.all.map(p=>p[0]),zs=o.all.map(p=>p[1]),sp=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...zs)-Math.min(...zs))*S;
 sel=0;apply();tg.set(((Math.min(...xs)+Math.max(...xs))/2-OX)*S,(groups[o.L0-1].position.y+groups[o.L1-1].position.y)/2,((Math.min(...zs)+Math.max(...zs))/2-OZ)*S);rad=Math.max(35,Math.min(140,sp*1.4+30));upd()}
function steps(r){const nd=r.nodes.map(k=>NODE[k]),out=[],same=(i,j)=>r.nodes[i].split('@')[0]===r.nodes[j].split('@')[0];
